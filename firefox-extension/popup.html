<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>TikTok Favorites Cleaner</title>
  <style>
    body { width: 260px; margin: 0; padding: 16px; font: 13px system-ui, sans-serif; color: #202124; }
    h1 { margin: 0 0 8px; font-size: 15px; }
    p { line-height: 1.45; color: #5f6368; }
    button { width: 100%; border: 0; border-radius: 8px; padding: 10px; background: #fe2c55; color: white; font-weight: 700; cursor: pointer; }
    #status { min-height: 18px; margin-top: 9px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>TikTok Favorites Cleaner</h1>
  <p>Abre el panel local sobre TikTok. La extensión no envía cookies ni datos a ningún servidor.</p>
  <button id="open">Abrir panel</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
